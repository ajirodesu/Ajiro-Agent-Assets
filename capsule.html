<!DOCTYPE html>
<html lang="en" style="color-scheme: dark;">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
  <meta content="#212121" name="theme-color"/>
  <title>Ajiro Agent - ChatGPT-style Message Capsule</title>
  <style>
    :root {
      --page-bg: #212121;
      --composer-bg: #303030;
      --text: #ececec;
      --placeholder: #9b9b9b;
      --icon: #ececec;
      --hover: rgba(255, 255, 255, 0.1);
      --keyboard-offset: 0px;
      --line: 24px;
      --font: 'Söhne', ui-sans-serif, system-ui, -apple-system, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--page-bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }

    body {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      touch-action: manipulation;
      /* Never block typing or copying inside inputs / messages */
      -webkit-user-select: none;
      user-select: none;
    }

    /* ───────── Footer dock (rides above keyboard) ───────── */
    #footerContainer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      padding: 8px 0 calc(12px + env(safe-area-inset-bottom, 0px));
      pointer-events: none;
      background: linear-gradient(to top, var(--page-bg) 70%, rgba(33, 33, 33, 0));
      transform: translate3d(0, calc(-1 * var(--keyboard-offset)), 0);
      will-change: transform;
      transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1),
                  padding-bottom 0.28s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #footerContainer.kb-open {
      padding-bottom: 8px;
    }
    .capsule-column {
      width: 100%;
      max-width: 768px;
      margin: 0 auto;
      /* Inactive (idle + empty): side margin is doubled */
      padding: 0 24px;
      pointer-events: auto;
      transition: padding 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    /* Active (focused or has text): normal 12px side margin */
    #footerContainer.active .capsule-column {
      padding: 0 12px;
    }

    /* ───────── The capsule ───────── */
    .capsule {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      grid-template-areas: "lead text trail";
      align-items: center;
      width: 100%;
      min-height: 52px;
      padding: 8px;
      background: var(--composer-bg);
      border-radius: 28px;
      cursor: text;
    }
    /* Wrapped / multi-line layout: text on top, controls row below */
    .capsule[data-mode="multi"] {
      grid-template-areas:
        "text text text"
        "lead .    trail";
    }

    .cap-lead  { grid-area: lead;  display: flex; align-items: center; }
    .cap-trail { grid-area: trail; display: flex; align-items: center; gap: 4px; }
    .cap-field {
      grid-area: text;
      min-width: 0;
      padding: 0 4px;
    }
    .capsule[data-mode="multi"] .cap-field {
      padding: 4px 8px 12px;
    }

    .cap-btn {
      width: 36px;
      height: 36px;
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 9999px;
      background: transparent;
      color: var(--icon);
      cursor: pointer;
      transition: background-color 0.15s ease, opacity 0.15s ease;
    }
    .cap-btn:hover { background: var(--hover); }
    .cap-btn:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.5); outline-offset: 1px; }
    .cap-btn svg { display: block; }

    .cap-btn.solid {
      background: #fff;
      color: #000;
    }
    .cap-btn.solid:hover { background: #e5e5e5; }
    .cap-btn[hidden] { display: none; }

    /* ───────── Textarea ───────── */
    .chat-input {
      display: block;
      width: 100%;
      height: var(--line);
      max-height: 200px;
      margin: 0;
      padding: 0;
      border: 0;
      outline: none;
      resize: none;
      background: transparent;
      color: var(--text);
      caret-color: #fff;
      font-family: var(--font);
      font-size: 16px;            /* 16px prevents iOS focus-zoom */
      font-weight: 400;
      line-height: var(--line);
      overflow-y: hidden;
      overflow-anchor: none;
      -webkit-appearance: none;
      appearance: none;
      -webkit-user-select: text;
      user-select: text;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
    }
    .chat-input::placeholder { color: var(--placeholder); opacity: 1; }
    .chat-input::-webkit-scrollbar { width: 4px; }
    .chat-input::-webkit-scrollbar-track { background: transparent; }
    .chat-input::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.25); border-radius: 9999px; }
    .chat-input.flash { background: rgba(59, 130, 246, 0.35); border-radius: 4px; }

    /* ───────── Messages ───────── */
    .user-bubble {
      align-self: flex-end;
      max-width: 85%;
      padding: 10px 20px;
      border-radius: 24px;
      background: var(--composer-bg);
      color: var(--text);
      font-size: 16px;
      line-height: 24px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      -webkit-user-select: text;
      user-select: text;
    }

    #sizingClone {
      position: absolute;
      top: -9999px;
      left: -9999px;
      visibility: hidden;
      pointer-events: none;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-wrap: break-word;
      margin: 0;
      padding: 0;
      border: 0;
    }

    /* ───────── Test header (plain CSS, replaces Tailwind) ───────── */
    .hdr {
      flex: none;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      padding: 10px 16px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: var(--page-bg);
    }
    .hdr-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .hdr-text { min-width: 0; }
    .hdr-title { margin: 0; font-size: 13px; font-weight: 600; line-height: 1; color: #fff; }
    .hdr-sub { display: block; margin-top: 4px; font-size: 11px; color: #9b9b9b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .stats {
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px;
      padding: 4px 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      background: #2a2a2a;
      font-size: 11px;
    }
    .stat-label { color: #9b9b9b; }
    .stat-val { color: #fff; font-weight: 600; }
    .stat-val.ok { color: #34d399; }
    .stat-val.cyan { color: #22d3ee; }
    .stat-val.rose { color: #fb7185; }
    .stat-val.amber { color: #fbbf24; }

    .toolbar { display: flex; align-items: center; gap: 6px; width: 100%; overflow-x: auto; }
    .tbtn {
      flex: none;
      padding: 4px 10px;
      border: 1px solid var(--tb-border, rgba(255, 255, 255, 0.06));
      border-radius: 8px;
      background: var(--tb-bg, #2f2f2f);
      color: var(--tb-fg, #d1d5db);
      font: 500 11px/16px var(--font);
      white-space: nowrap;
      cursor: pointer;
      transition: transform 0.12s ease, background-color 0.15s ease;
    }
    .tbtn:active { transform: scale(0.95); }
    .tbtn.sky        { --tb-bg: rgba(14, 165, 233, 0.15);  --tb-border: rgba(14, 165, 233, 0.35);  --tb-fg: #7dd3fc; }
    .tbtn.indigo     { --tb-bg: rgba(99, 102, 241, 0.15);  --tb-border: rgba(99, 102, 241, 0.35);  --tb-fg: #a5b4fc; }
    .tbtn.neutral    { --tb-bg: #2f2f2f;                    --tb-border: rgba(255, 255, 255, 0.06); --tb-fg: #d1d5db; }
    .tbtn.emerald    { --tb-bg: rgba(2, 44, 34, 0.4);       --tb-border: rgba(16, 185, 129, 0.3);   --tb-fg: #6ee7b7; }
    .tbtn.teal       { --tb-bg: rgba(4, 47, 46, 0.4);       --tb-border: rgba(20, 184, 166, 0.3);   --tb-fg: #5eead4; }
    .tbtn.violet     { --tb-bg: rgba(30, 27, 75, 0.4);      --tb-border: rgba(99, 102, 241, 0.3);   --tb-fg: #a5b4fc; }
    .tbtn.rose       { --tb-bg: rgba(76, 5, 25, 0.4);       --tb-border: rgba(244, 63, 94, 0.3);    --tb-fg: #fda4af; }
    .tbtn.rose-solid { --tb-bg: rgba(244, 63, 94, 0.15);    --tb-border: rgba(244, 63, 94, 0.3);    --tb-fg: #fda4af; }
    .tbtn.amber      { --tb-bg: rgba(245, 158, 11, 0.2);    --tb-border: rgba(245, 158, 11, 0.4);   --tb-fg: #fcd34d; }

    /* ───────── Chat stream ───────── */
    .chat-stream {
      flex: 1 1 0;
      min-height: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 12px;
      padding: 16px 16px 0;
      overflow-y: auto;
      -webkit-user-select: text;
      user-select: text;
    }
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      text-align: center;
      pointer-events: none;
      -webkit-user-select: none;
      user-select: none;
    }
    .empty-title { margin: 0; font-size: 22px; font-weight: 500; color: var(--text); }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    @media (prefers-reduced-motion: reduce) {
      #footerContainer { transition: none; }
    }
  </style>
</head>
<body>

<!-- Diagnostics / test bar -->
<header class="hdr">
  <div class="hdr-row">
    <div class="hdr-text">
      <h1 class="hdr-title">Ajiro Agent</h1>
      <span class="hdr-sub" id="capsuleHeightLabel">52px · 1 line</span>
    </div>
    <div class="stats">
      <span class="stat-label">Keyboard</span><span class="stat-val ok" id="kbStatusBadge">Linked</span>
      <span class="stat-label">Offset</span><span class="stat-val cyan" id="kbOffsetLabel">0px</span>
      <span class="stat-label">Lines</span><span class="stat-val ok" id="lineCountBadge">1</span>
      <span class="stat-label">Height</span><span class="stat-val" id="exactHeightLabel">52px</span>
    </div>
  </div>
  <div class="toolbar no-scrollbar">
    <button class="tbtn sky" id="toggleKbSimBtn" type="button">Simulate keyboard</button>
    <button class="tbtn indigo" data-paste type="button">Paste long text</button>
    <button class="tbtn neutral" data-preset="1" type="button">1 line</button>
    <button class="tbtn emerald" data-preset="2" type="button">2 lines</button>
    <button class="tbtn teal" data-preset="3" type="button">3 lines</button>
    <button class="tbtn violet" data-preset="6" type="button">6 lines</button>
    <button class="tbtn rose" data-preset="14" type="button">14 lines (scroll)</button>
    <button class="tbtn rose-solid" id="clearBtn" type="button">Clear</button>
  </div>
</header>

<!-- Chat stream -->
<main class="chat-stream" id="chatStream" style="-webkit-user-select:text;user-select:text;">
  <div class="empty-state" id="emptyState">
    <p class="empty-title">What can I help with?</p>
  </div>
</main>

<!-- Composer -->
<footer id="footerContainer">
  <div class="capsule-column">
    <div class="capsule" data-mode="single" id="messageCapsule">
      <div class="cap-lead">
        <button aria-label="Add files and more" class="cap-btn" id="plusBtn" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>

      <div class="cap-field">
        <textarea aria-label="Message" autocapitalize="sentences" autocomplete="off" autocorrect="on" class="chat-input" enterkeyhint="enter" id="unifiedInput" name="chat_message" placeholder="Ask anything" rows="1" spellcheck="true"></textarea>
      </div>

      <div class="cap-trail" id="trailGroup">
        <button aria-label="Dictate" class="cap-btn" id="micBtn" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11v1a7 7 0 0 0 14 0v-1M12 19v3"/></svg>
        </button>
        <button aria-label="Start voice mode" class="cap-btn solid" id="voiceBtn" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 10v4M8 7v10M12 4v16M16 8v8M20 11v2"/></svg>
        </button>
        <button aria-label="Send message" class="cap-btn solid" hidden id="sendBtn" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
  </div>
</footer>

<div aria-hidden="true" id="sizingClone"></div>

<script>
(() => {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const footer = $('footerContainer');
  const capsule = $('messageCapsule');
  const input = $('unifiedInput');
  const leadGroup = capsule.querySelector('.cap-lead');
  const trailGroup = $('trailGroup');
  const voiceBtn = $('voiceBtn');
  const sendBtn = $('sendBtn');
  const chatStream = $('chatStream');
  const emptyState = $('emptyState');
  const clone = $('sizingClone');
  const kbStatusBadge = $('kbStatusBadge');
  const kbOffsetLabel = $('kbOffsetLabel');
  const lineCountBadge = $('lineCountBadge');
  const exactHeightLabel = $('exactHeightLabel');
  const capsuleHeightLabel = $('capsuleHeightLabel');
  const toggleKbSimBtn = $('toggleKbSimBtn');

  const LINE_HEIGHT = 24;
  const MAX_TEXT_HEIGHT = 200;     // ChatGPT caps the text area at 200px, then scrolls
  const COARSE = window.matchMedia('(pointer: coarse)');

  const ACTIVE_MARGIN = 12;        // side margin when active; doubled (24px) when inactive

  let isFocused = false;
  let isSimulatedKbOpen = false;
  let keyboardOffset = 0;
  let mode = 'single';
  let lastCloneKey = '';
  let lastCloneResult = false;

  /* ───────── Width available for text in single-row layout ───────── */
  function singleRowTextWidth() {
    const cs = getComputedStyle(capsule);
    const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    const fieldPad = 8; // 4px each side in single mode
    // Use the ACTIVE capsule width (12px side margins) so the result never
    // depends on the margin transition that runs when focusing/blurring.
    const activeCapsuleW = Math.min(768, footer.clientWidth) - ACTIVE_MARGIN * 2;
    return Math.max(
      60,
      activeCapsuleW - padX - leadGroup.offsetWidth - trailGroup.offsetWidth - fieldPad
    );
  }

  /* ───────── Does the text fit on ONE line in the single-row layout? ───────── */
  function fitsOnOneLine(text, width) {
    if (!text) return true;
    if (text.indexOf('\n') !== -1) return false;
    const key = width + '|' + text;
    if (key === lastCloneKey) return lastCloneResult;

    const cs = getComputedStyle(input);
    clone.style.width = width + 'px';
    clone.style.fontFamily = cs.fontFamily;
    clone.style.fontSize = cs.fontSize;
    clone.style.fontWeight = cs.fontWeight;
    clone.style.letterSpacing = cs.letterSpacing;
    clone.style.lineHeight = LINE_HEIGHT + 'px';
    clone.textContent = text;

    lastCloneKey = key;
    lastCloneResult = clone.scrollHeight <= LINE_HEIGHT + 1;
    return lastCloneResult;
  }

  /* ───────── Core sync: layout mode, textarea height, buttons ───────── */
  function sync() {
    const text = input.value;
    const hasText = text.trim().length > 0;

    // Voice <-> Send swap (ChatGPT behaviour)
    voiceBtn.hidden = hasText;
    sendBtn.hidden = !hasText;

    // Active = focused or has text -> normal margin. Inactive -> doubled margin.
    footer.classList.toggle('active', isFocused || hasText);

    // Layout mode — same measurement in both directions, so it never oscillates
    const nextMode = fitsOnOneLine(text, singleRowTextWidth()) ? 'single' : 'multi';
    if (nextMode !== mode) {
      mode = nextMode;
      capsule.dataset.mode = mode;
    }

    // Auto-size textarea in whole-line steps
    input.style.height = LINE_HEIGHT + 'px';
    const contentH = Math.max(LINE_HEIGHT, input.scrollHeight);
    const targetH = Math.min(contentH, MAX_TEXT_HEIGHT);
    input.style.height = targetH + 'px';
    input.style.overflowY = contentH > MAX_TEXT_HEIGHT ? 'auto' : 'hidden';

    // Keep caret in view when scrolling inside a capped textarea
    if (contentH > MAX_TEXT_HEIGHT && document.activeElement === input &&
        input.selectionStart === input.value.length) {
      input.scrollTop = input.scrollHeight;
    }

    // Diagnostics
    const lines = Math.max(1, Math.round(contentH / LINE_HEIGHT));
    const h = capsule.offsetHeight;
    lineCountBadge.textContent = String(lines);
    lineCountBadge.className = 'stat-val ' + (contentH > MAX_TEXT_HEIGHT ? 'rose' : 'ok');
    exactHeightLabel.textContent = h + 'px';
    capsuleHeightLabel.textContent = contentH > MAX_TEXT_HEIGHT
      ? `${h}px · ${lines} lines (scrolling)`
      : `${h}px · ${lines} ${lines === 1 ? 'line' : 'lines'}`;

    updateStreamPadding();
  }

  /* ───────── Keep messages clear of the composer ───────── */
  function updateStreamPadding() {
    const nearBottom = chatStream.scrollHeight - chatStream.scrollTop - chatStream.clientHeight < 80;
    chatStream.style.paddingBottom = (footer.offsetHeight + 12) + 'px';
    if (nearBottom) chatStream.scrollTop = chatStream.scrollHeight;
  }

  /* ───────── Keyboard handling ───────── */
  function setKeyboardElevation(px, simulated) {
    keyboardOffset = px;
    const open = px > 50;
    document.documentElement.style.setProperty('--keyboard-offset', open ? px + 'px' : '0px');
    footer.classList.toggle('kb-open', open);
    kbStatusBadge.textContent = open ? (simulated ? 'Simulated' : 'Open') : 'Linked';
    kbStatusBadge.className = 'stat-val ' + (open ? 'amber' : 'ok');
    kbOffsetLabel.textContent = open ? Math.round(px) + 'px' : '0px';
  }

  function handleViewportChange() {
    if (isSimulatedKbOpen || !window.visualViewport) return;
    const vv = window.visualViewport;
    const layoutH = document.documentElement.clientHeight;
    setKeyboardElevation(Math.max(0, layoutH - (vv.offsetTop + vv.height)), false);
    window.scrollTo(0, 0);
  }

  toggleKbSimBtn.addEventListener('click', () => {
    isSimulatedKbOpen = !isSimulatedKbOpen;
    if (isSimulatedKbOpen) {
      setKeyboardElevation(290, true);
      toggleKbSimBtn.textContent = 'Close keyboard (290px)';
      toggleKbSimBtn.className = 'tbtn amber';
    } else {
      setKeyboardElevation(0, false);
      toggleKbSimBtn.textContent = 'Simulate keyboard';
      toggleKbSimBtn.className = 'tbtn sky';
      handleViewportChange();
    }
  });

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', handleViewportChange);
    window.visualViewport.addEventListener('scroll', handleViewportChange);
  }

  /* ───────── Focus: buttons must never steal it (keeps keyboard open) ───────── */
  capsule.addEventListener('mousedown', (e) => {
    if (e.target !== input) e.preventDefault();
  });
  // Tapping empty capsule space focuses the field, like ChatGPT
  capsule.addEventListener('click', (e) => {
    if (!e.target.closest('button') && e.target !== input) input.focus({ preventScroll: true });
  });
  $('plusBtn').addEventListener('click', () => input.focus({ preventScroll: true }));

  /* ───────── Input events ───────── */
  input.addEventListener('input', sync);
  input.addEventListener('focus', () => { isFocused = true; sync(); });
  input.addEventListener('blur', () => { isFocused = false; sync(); });

  input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing || e.keyCode === 229) return;
    // Touch devices: Enter inserts a newline, the Send button sends (ChatGPT mobile)
    if (COARSE.matches) return;
    e.preventDefault();
    submit();
  });

  sendBtn.addEventListener('click', submit);

  function submit() {
    const msg = input.value.trim();
    if (!msg) return;

    if (emptyState.parentNode) emptyState.remove();

    const bubble = document.createElement('div');
    bubble.className = 'user-bubble';
    bubble.textContent = msg;
    chatStream.appendChild(bubble);

    input.value = '';
    sync();                                  // collapse capsule immediately
    chatStream.scrollTop = chatStream.scrollHeight;
    input.focus({ preventScroll: true });    // keep keyboard open
  }

  /* ───────── Test helpers ───────── */
  function setText(value) {
    input.focus({ preventScroll: true });
    input.value = value;
    input.setSelectionRange(value.length, value.length);
    sync();
  }

  const makeLines = (n) =>
    Array.from({ length: n }, (_, i) => `Line ${i + 1}: sample text for the capsule`).join('\n');

  document.querySelectorAll('[data-preset]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const n = Number(btn.dataset.preset);
      setText(n === 1 ? 'Exact one-line message' : makeLines(n));
    });
  });

  document.querySelector('[data-paste]').addEventListener('click', () => {
    setText('Here is a long pasted paragraph with no manual line breaks. It starts in the single-row layout, then wraps and the capsule switches to the expanded layout with the controls row underneath, exactly like ChatGPT does when the text no longer fits beside the buttons.');
  });

  $('clearBtn').addEventListener('click', () => {
    input.focus({ preventScroll: true });
    input.select();
    input.classList.add('flash');
    setTimeout(() => {
      input.classList.remove('flash');
      input.value = '';
      sync();
    }, 140);
  });

  /* ───────── Resize / layout observers ───────── */
  let raf = 0;
  const queueSync = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(sync); };
  window.addEventListener('resize', () => { handleViewportChange(); queueSync(); });
  if ('ResizeObserver' in window) new ResizeObserver(updateStreamPadding).observe(footer);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { lastCloneKey = ''; sync(); });

  handleViewportChange();
  sync();
})();
</script>
</body>
</html>
