<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#212121">
  <meta name="color-scheme" content="dark">
  <title>Ajiro Agent – Message Capsule</title>
  <style>
    /* ═════════════════════════ Design tokens ═════════════════════════ */
    :root {
      color-scheme: dark;

      --page-bg: #212121;
      --composer-bg: #303030;
      --text: #ececec;
      --placeholder: #9b9b9b;
      --icon: #ececec;
      --hover: rgba(255, 255, 255, 0.1);

      --line: 24px;              /* textarea line height (must match JS LINE_HEIGHT) */
      --gutter: 12px;            /* standard side margin                             */
      --keyboard-offset: 0px;    /* written by JS                                    */

      --font: ui-sans-serif, system-ui, -apple-system, "SF Pro Text", "Segoe UI",
              Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      margin: 0;
      background: var(--page-bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      overscroll-behavior: none;
    }

    body {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    /* ═════════════════════════ Composer dock ═════════════════════════ */
    #footerContainer {
      position: fixed;
      inset: auto 0 0 0;
      z-index: 30;
      padding: 8px 0 calc(12px + env(safe-area-inset-bottom, 0px));
      pointer-events: none;
      background: linear-gradient(to top, var(--page-bg) 70%, transparent);
      transform: translate3d(0, calc(-1 * var(--keyboard-offset)), 0);
    }
    #footerContainer.kb-open { padding-bottom: 8px; }

    /* Standard margin when active (focused or has text); doubled when inactive. No animation. */
    #footerContainer:not(.active) { --gutter: 24px; }

    .capsule-column {
      width: 100%;
      max-width: 768px;
      margin: 0 auto;
      padding-inline:
        calc(var(--gutter) + env(safe-area-inset-left, 0px))
        calc(var(--gutter) + env(safe-area-inset-right, 0px));
      pointer-events: auto;
    }

    /* ═════════════════════════ Capsule ═════════════════════════ */
    .capsule {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      grid-template-areas: "lead text trail";
      align-items: center;
      width: 100%;
      min-height: 52px;
      padding: 8px;
      background: var(--composer-bg);
      border-radius: 28px;
      cursor: text;
    }
    .capsule[data-mode="multi"] {
      grid-template-areas:
        "text text text"
        "lead .    trail";
    }

    .cap-lead  { grid-area: lead;  display: flex; align-items: center; }
    .cap-trail { grid-area: trail; display: flex; align-items: center; gap: 4px; }
    .cap-field { grid-area: text; min-width: 0; padding: 0 4px; }
    .capsule[data-mode="multi"] .cap-field {
      padding: 10px 8px 12px;   /* 8px capsule + 10px = 18px top, balances the bottom */
    }

    .cap-btn {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 0;
      border-radius: 9999px;
      background: transparent;
      color: var(--icon);
      cursor: pointer;
    }
    .cap-btn svg { display: block; }
    .cap-btn:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.6); outline-offset: 1px; }
    @media (hover: hover) {
      .cap-btn:hover { background: var(--hover); }
      .cap-btn.solid:hover:not(:disabled) { background: #e5e5e5; }
    }

    .cap-btn.solid { background: #fff; color: #000; }
    .cap-btn.solid:disabled {                 /* visible but inactive */
      background: rgba(255, 255, 255, 0.25);
      color: rgba(0, 0, 0, 0.45);
      cursor: default;
      pointer-events: none;
    }

    /* ═════════════════════════ Textarea ═════════════════════════ */
    .chat-input {
      display: block;
      width: 100%;
      height: var(--line);
      max-height: 200px;
      margin: 0;
      padding: 0;
      border: 0;
      outline: none;
      resize: none;
      background: transparent;
      color: var(--text);
      caret-color: #fff;
      font: 400 16px/var(--line) var(--font);   /* 16px prevents iOS focus-zoom */
      overflow-y: hidden;
      overflow-anchor: none;
      -webkit-appearance: none;
      appearance: none;
      -webkit-user-select: text;
      user-select: text;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
    }
    .chat-input::placeholder { color: var(--placeholder); opacity: 1; }
    .chat-input::-webkit-scrollbar { width: 4px; }
    .chat-input::-webkit-scrollbar-track { background: transparent; }
    .chat-input::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.25); border-radius: 9999px; }
    .chat-input.flash { background: rgba(59, 130, 246, 0.35); border-radius: 4px; }

    /* Off-screen twin of the textarea used to measure single-line fit */
    #sizingClone {
      position: absolute;
      top: -9999px;
      left: -9999px;
      margin: 0;
      padding: 0;
      border: 0;
      visibility: hidden;
      pointer-events: none;
      contain: layout style;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    /* ═════════════════════════ Messages ═════════════════════════ */
    .chat-stream {
      flex: 1 1 0;
      min-height: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px 16px 0;
      overflow-y: auto;
      -webkit-user-select: text;
      user-select: text;
    }
    /* margin-top:auto bottom-aligns short content without clipping overflow (unlike justify-content:flex-end) */
    .chat-stream > :first-child { margin-top: auto; }

    .empty-state {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      text-align: center;
      pointer-events: none;
      -webkit-user-select: none;
      user-select: none;
    }
    .empty-title { margin: 0; font-size: 22px; font-weight: 500; }

    .user-bubble {
      align-self: flex-end;
      max-width: 85%;
      padding: 10px 20px;
      border-radius: 24px;
      background: var(--composer-bg);
      font-size: 16px;
      line-height: 24px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    /* ═════════════════════════ Test / diagnostics bar ═════════════════════════ */
    .hdr {
      flex: none;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      padding: calc(10px + env(safe-area-inset-top, 0px)) 16px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: var(--page-bg);
    }
    .hdr-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; }
    .hdr-text { min-width: 0; }
    .hdr-title { margin: 0; font-size: 13px; font-weight: 600; line-height: 1; color: #fff; }
    .hdr-sub { display: block; margin-top: 4px; font-size: 11px; color: #9b9b9b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .stats {
      display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px;
      padding: 4px 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9999px;
      background: #2a2a2a;
      font-size: 11px;
    }
    .stat-label { color: #9b9b9b; }
    .stat-val { color: #fff; font-weight: 600; }
    .stat-val.ok    { color: #34d399; }
    .stat-val.cyan  { color: #22d3ee; }
    .stat-val.rose  { color: #fb7185; }
    .stat-val.amber { color: #fbbf24; }

    .toolbar { display: flex; align-items: center; gap: 6px; width: 100%; overflow-x: auto; scrollbar-width: none; }
    .toolbar::-webkit-scrollbar { display: none; }
    .tbtn {
      flex: none;
      padding: 4px 10px;
      border: 1px solid var(--tb-border, rgba(255, 255, 255, 0.06));
      border-radius: 8px;
      background: var(--tb-bg, #2f2f2f);
      color: var(--tb-fg, #d1d5db);
      font: 500 11px/16px var(--font);
      white-space: nowrap;
      cursor: pointer;
    }
    .tbtn:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.6); outline-offset: 1px; }
    .tbtn.sky        { --tb-bg: rgba(14, 165, 233, 0.15); --tb-border: rgba(14, 165, 233, 0.35); --tb-fg: #7dd3fc; }
    .tbtn.indigo     { --tb-bg: rgba(99, 102, 241, 0.15); --tb-border: rgba(99, 102, 241, 0.35); --tb-fg: #a5b4fc; }
    .tbtn.neutral    { --tb-bg: #2f2f2f;                  --tb-border: rgba(255, 255, 255, 0.06); --tb-fg: #d1d5db; }
    .tbtn.emerald    { --tb-bg: rgba(2, 44, 34, 0.4);     --tb-border: rgba(16, 185, 129, 0.3);  --tb-fg: #6ee7b7; }
    .tbtn.teal       { --tb-bg: rgba(4, 47, 46, 0.4);     --tb-border: rgba(20, 184, 166, 0.3);  --tb-fg: #5eead4; }
    .tbtn.violet     { --tb-bg: rgba(30, 27, 75, 0.4);    --tb-border: rgba(99, 102, 241, 0.3);  --tb-fg: #a5b4fc; }
    .tbtn.rose       { --tb-bg: rgba(76, 5, 25, 0.4);     --tb-border: rgba(244, 63, 94, 0.3);   --tb-fg: #fda4af; }
    .tbtn.rose-solid { --tb-bg: rgba(244, 63, 94, 0.15);  --tb-border: rgba(244, 63, 94, 0.3);   --tb-fg: #fda4af; }
    .tbtn.amber      { --tb-bg: rgba(245, 158, 11, 0.2);  --tb-border: rgba(245, 158, 11, 0.4);  --tb-fg: #fcd34d; }
  </style>
</head>
<body>

<!-- Diagnostics / test bar (safe to delete together with the "Demo harness" block in the script) -->
<header class="hdr">
  <div class="hdr-row">
    <div class="hdr-text">
      <h1 class="hdr-title">Ajiro Agent</h1>
      <span class="hdr-sub" id="capsuleHeightLabel">52px · 1 line</span>
    </div>
    <div class="stats" aria-label="Composer diagnostics">
      <span class="stat-label">Keyboard</span><span class="stat-val ok" id="kbStatusBadge">Linked</span>
      <span class="stat-label">Offset</span><span class="stat-val cyan" id="kbOffsetLabel">0px</span>
      <span class="stat-label">Lines</span><span class="stat-val ok" id="lineCountBadge">1</span>
      <span class="stat-label">Height</span><span class="stat-val" id="exactHeightLabel">52px</span>
    </div>
  </div>
  <div class="toolbar">
    <button class="tbtn sky" id="toggleKbSimBtn" type="button">Simulate keyboard</button>
    <button class="tbtn indigo" data-paste type="button">Paste long text</button>
    <button class="tbtn neutral" data-preset="1" type="button">1 line</button>
    <button class="tbtn emerald" data-preset="2" type="button">2 lines</button>
    <button class="tbtn teal" data-preset="3" type="button">3 lines</button>
    <button class="tbtn violet" data-preset="6" type="button">6 lines</button>
    <button class="tbtn rose" data-preset="14" type="button">14 lines (scroll)</button>
    <button class="tbtn rose-solid" id="clearBtn" type="button">Clear</button>
  </div>
</header>

<!-- Chat stream -->
<main class="chat-stream" id="chatStream" role="log" aria-live="polite" aria-label="Conversation">
  <div class="empty-state" id="emptyState">
    <p class="empty-title">What can I help with?</p>
  </div>
</main>

<!-- Composer -->
<footer id="footerContainer">
  <div class="capsule-column">
    <div class="capsule" data-mode="single" id="messageCapsule" role="group" aria-label="Message composer">
      <div class="cap-lead">
        <button aria-label="Add files and more" class="cap-btn" id="plusBtn" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>

      <div class="cap-field">
        <textarea aria-label="Message" autocapitalize="sentences" autocomplete="off" autocorrect="on" class="chat-input" enterkeyhint="enter" id="unifiedInput" name="chat_message" placeholder="Ask anything" rows="1" spellcheck="true"></textarea>
      </div>

      <div class="cap-trail" id="trailGroup">
        <button aria-label="Send message" class="cap-btn solid" disabled id="sendBtn" type="button">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
  </div>
</footer>

<div aria-hidden="true" id="sizingClone"></div>

<script>
(() => {
  'use strict';

  /* ═════════════════════════ Elements & config ═════════════════════════ */
  const $ = (id) => document.getElementById(id);

  const footer     = $('footerContainer');
  const capsule    = $('messageCapsule');
  const input      = $('unifiedInput');
  const leadGroup  = capsule.querySelector('.cap-lead');
  const trailGroup = $('trailGroup');
  const sendBtn    = $('sendBtn');
  const plusBtn    = $('plusBtn');
  const chatStream = $('chatStream');
  const clone      = $('sizingClone');

  const LINE_HEIGHT    = 24;   // keep in sync with --line
  const MAX_TEXT_H     = 200;  // text area caps here, then scrolls
  const FIELD_PAD_X    = 8;    // .cap-field horizontal padding in single-row mode
  const STREAM_GAP     = 12;   // breathing room between last message and composer
  const KB_OPEN_MIN_PX = 50;   // ignore tiny viewport deltas (URL bars, etc.)
  const COARSE = window.matchMedia('(pointer: coarse)');

  /* ═════════════════════════ State ═════════════════════════ */
  let focused   = false;
  let mode      = 'single';
  let textH     = LINE_HEIGHT;      // last applied textarea height
  let kbOffset  = 0;
  let kbSimulated = false;
  let streamPad = -1;
  let fitKey    = '';               // memo for fitsOnOneLine
  let fitVal    = true;
  let rafSync   = 0;
  let rafView   = 0;

  /* ═════════════════════════ Measurement ═════════════════════════ */
  // Mirror the textarea's typography onto the off-screen clone (re-run when fonts load).
  function prepareClone() {
    const cs = getComputedStyle(input);
    clone.style.fontFamily    = cs.fontFamily;
    clone.style.fontSize      = cs.fontSize;
    clone.style.fontWeight    = cs.fontWeight;
    clone.style.letterSpacing = cs.letterSpacing;
    clone.style.lineHeight    = LINE_HEIGHT + 'px';
    fitKey = '';
  }

  // Text width available when the capsule is in the single-row layout.
  function singleRowTextWidth() {
    const cs = getComputedStyle(capsule);
    const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
    return Math.max(
      60,
      capsule.clientWidth - padX - leadGroup.offsetWidth - trailGroup.offsetWidth - FIELD_PAD_X
    );
  }

  // Does the text fit on ONE line in the single-row layout?
  function fitsOnOneLine(text) {
    if (!text) return true;
    if (text.includes('\n')) return false;

    const width = singleRowTextWidth();
    const key = width + '|' + text;
    if (key === fitKey) return fitVal;

    clone.style.width = width + 'px';
    clone.textContent = text;
    fitKey = key;
    fitVal = clone.scrollHeight <= LINE_HEIGHT + 1;
    return fitVal;
  }

  /* ═════════════════════════ Core sync ═════════════════════════ */
  function sync() {
    rafSync = 0;
    const text = input.value;
    const hasText = text.trim().length > 0;

    // Send button is always visible; inactive until there is something to send.
    if (sendBtn.disabled === hasText) sendBtn.disabled = !hasText;

    // Active (focused or any text) = standard margin; inactive = doubled margin.
    footer.classList.toggle('active', focused || text.length > 0);

    // Layout mode (single row <-> expanded). Same measurement both directions: no oscillation.
    const nextMode = fitsOnOneLine(text) ? 'single' : 'multi';
    if (nextMode !== mode) {
      mode = nextMode;
      capsule.dataset.mode = mode;
    }

    // Textarea height, in whole-line steps. Only measure scrollHeight when expanded.
    let contentH = LINE_HEIGHT;
    if (mode === 'multi') {
      input.style.height = LINE_HEIGHT + 'px';
      contentH = Math.max(LINE_HEIGHT, input.scrollHeight);
    }
    const nextH = Math.min(contentH, MAX_TEXT_H);
    const scrolls = contentH > MAX_TEXT_H;
    if (nextH !== textH || mode === 'multi') {
      input.style.height = nextH + 'px';
      textH = nextH;
    }
    input.style.overflowY = scrolls ? 'auto' : 'hidden';

    // Keep the caret visible when typing at the end of a capped textarea.
    if (scrolls && document.activeElement === input && input.selectionStart === input.value.length) {
      input.scrollTop = input.scrollHeight;
    }

    updateDiagnostics(contentH, scrolls);
  }

  const queueSync = () => { if (!rafSync) rafSync = requestAnimationFrame(sync); };

  /* ═════════════════════════ Keep messages clear of the composer ═════════════════════════ */
  function updateStreamPadding() {
    const nearBottom = chatStream.scrollHeight - chatStream.scrollTop - chatStream.clientHeight < 80;
    const pad = footer.offsetHeight + STREAM_GAP;
    if (pad !== streamPad) {
      streamPad = pad;
      chatStream.style.paddingBottom = pad + 'px';
    }
    if (nearBottom) chatStream.scrollTop = chatStream.scrollHeight;
  }

  /* ═════════════════════════ Keyboard ═════════════════════════ */
  function setKeyboardOffset(px, simulated) {
    px = Math.max(0, Math.round(px));
    const open = px > KB_OPEN_MIN_PX;
    const next = open ? px : 0;
    if (next === kbOffset && !simulated === !kbSimulated) return;

    kbOffset = next;
    document.documentElement.style.setProperty('--keyboard-offset', next + 'px');
    footer.classList.toggle('kb-open', open);
    updateKeyboardDiagnostics(open, simulated);
  }

  function handleViewportChange() {
    rafView = 0;
    if (kbSimulated) return;
    const vv = window.visualViewport;
    if (!vv) return;
    const layoutH = document.documentElement.clientHeight;
    setKeyboardOffset(layoutH - (vv.offsetTop + vv.height), false);
    if (window.scrollY !== 0) window.scrollTo(0, 0);   // stop iOS from panning the page
  }
  const queueViewport = () => { if (!rafView) rafView = requestAnimationFrame(handleViewportChange); };

  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', queueViewport, { passive: true });
    window.visualViewport.addEventListener('scroll', queueViewport, { passive: true });
  }

  /* ═════════════════════════ Focus & input handling ═════════════════════════ */
  // Buttons must never steal focus (keeps the on-screen keyboard open).
  capsule.addEventListener('mousedown', (e) => {
    if (e.target !== input) e.preventDefault();
  });
  // Tapping empty capsule space focuses the field.
  capsule.addEventListener('click', (e) => {
    if (!e.target.closest('button') && e.target !== input) input.focus({ preventScroll: true });
  });
  plusBtn.addEventListener('click', () => {
    input.focus({ preventScroll: true });
    capsule.dispatchEvent(new CustomEvent('capsule:attach', { bubbles: true }));
  });

  input.addEventListener('input', sync);
  input.addEventListener('focus', () => { focused = true;  sync(); });
  input.addEventListener('blur',  () => { focused = false; sync(); });

  input.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.shiftKey || e.isComposing || e.keyCode === 229) return;
    if (COARSE.matches) return;          // touch: Enter = newline, Send button sends
    e.preventDefault();
    submit();
  });
  sendBtn.addEventListener('click', submit);

  function submit() {
    const text = input.value.trim();
    if (!text) return;

    input.value = '';
    sync();                               // collapse capsule immediately
    capsule.dispatchEvent(new CustomEvent('capsule:submit', { bubbles: true, detail: { text } }));
    input.focus({ preventScroll: true }); // keep keyboard open
  }

  /* ═════════════════════════ Diagnostics (no-ops when the bar is removed) ═════════════════════════ */
  const dx = {
    kbStatus: $('kbStatusBadge'),
    kbOffset: $('kbOffsetLabel'),
    lines:    $('lineCountBadge'),
    height:   $('exactHeightLabel'),
    summary:  $('capsuleHeightLabel'),
  };
  const put = (node, value, cls) => {
    if (!node) return;
    if (node.textContent !== value) node.textContent = value;
    if (cls !== undefined && node.className !== cls) node.className = cls;
  };

  function updateDiagnostics(contentH, scrolls) {
    if (!dx.lines) return;
    const lines = Math.max(1, Math.round(contentH / LINE_HEIGHT));
    const h = capsule.offsetHeight;
    put(dx.lines, String(lines), 'stat-val ' + (scrolls ? 'rose' : 'ok'));
    put(dx.height, h + 'px');
    put(dx.summary, scrolls
      ? `${h}px · ${lines} lines (scrolling)`
      : `${h}px · ${lines} ${lines === 1 ? 'line' : 'lines'}`);
  }

  function updateKeyboardDiagnostics(open, simulated) {
    put(dx.kbStatus, open ? (simulated ? 'Simulated' : 'Open') : 'Linked', 'stat-val ' + (open ? 'amber' : 'ok'));
    put(dx.kbOffset, kbOffset + 'px');
  }

  /* ═════════════════════════ Layout observers ═════════════════════════ */
  window.addEventListener('resize', () => { queueViewport(); queueSync(); }, { passive: true });
  window.addEventListener('orientationchange', () => { queueViewport(); queueSync(); }, { passive: true });
  window.addEventListener('pageshow', (e) => { if (e.persisted) { queueViewport(); queueSync(); } });

  if ('ResizeObserver' in window) new ResizeObserver(updateStreamPadding).observe(footer);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => { prepareClone(); queueSync(); });
  }

  /* ═════════════════════════ Demo harness (delete with the diagnostics bar) ═════════════════════════ */
  const emptyState = $('emptyState');

  // Host-side handler: this is where a real app would send the message.
  document.addEventListener('capsule:submit', (e) => {
    if (emptyState.parentNode) emptyState.remove();
    const bubble = document.createElement('div');
    bubble.className = 'user-bubble';
    bubble.textContent = e.detail.text;
    chatStream.appendChild(bubble);
    chatStream.scrollTop = chatStream.scrollHeight;
  });

  function setText(value) {
    input.focus({ preventScroll: true });
    input.value = value;
    input.setSelectionRange(value.length, value.length);
    sync();
  }
  const makeLines = (n) =>
    Array.from({ length: n }, (_, i) => `Line ${i + 1}: sample text for the capsule`).join('\n');

  document.querySelectorAll('[data-preset]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const n = Number(btn.dataset.preset);
      setText(n === 1 ? 'Exact one-line message' : makeLines(n));
    });
  });

  document.querySelector('[data-paste]').addEventListener('click', () => {
    setText('Here is a long pasted paragraph with no manual line breaks. It starts in the single-row layout, then wraps and the capsule switches to the expanded layout with the controls row underneath, exactly like ChatGPT does when the text no longer fits beside the buttons.');
  });

  $('clearBtn').addEventListener('click', () => {
    input.focus({ preventScroll: true });
    input.select();
    input.classList.add('flash');
    setTimeout(() => {
      input.classList.remove('flash');
      input.value = '';
      sync();
    }, 140);
  });

  const kbBtn = $('toggleKbSimBtn');
  kbBtn.addEventListener('click', () => {
    kbSimulated = !kbSimulated;
    if (kbSimulated) {
      setKeyboardOffset(290, true);
      kbBtn.textContent = 'Close keyboard (290px)';
      kbBtn.className = 'tbtn amber';
    } else {
      setKeyboardOffset(0, false);
      kbBtn.textContent = 'Simulate keyboard';
      kbBtn.className = 'tbtn sky';
      handleViewportChange();
    }
  });

  /* ═════════════════════════ Init ═════════════════════════ */
  prepareClone();
  handleViewportChange();
  sync();
  updateStreamPadding();
})();
</script>
</body>
</html>
